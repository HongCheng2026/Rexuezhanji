<!doctype html>

<body>

  <script>globalThis.RXGame = {};</script>
  <script src="../../src/h5/UI/Gacha/gachaConfig.js"></script>

  <script src="../../src/h5/UI/Inventory/inventoryCatalog.js"></script>
  <script src="../../src/h5/UI/Inventory/inventoryView.js"></script>

        "stamina_potion": assetBase + "shop/items/energy-potion-inventory.png"

        var rewardIndex = index % rewardIds.length;
        return { drawNumber: 640 - index, tier: tiers[rewardIndex], rewardId: rewardIds[rewardIndex], label: labels[rewardIndex], quantity: 1, at: Date.now() - index * 60000 };

        mount: document.querySelector("#gachaMount"), config: RXGame.gachaConfig,

        state: { target: "pilot", pity: 36, history: history }, tickets: 18, diamonds: 960, cloudMode: false,
